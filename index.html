<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lua API · DripHook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0b0b14;
      --bg-secondary: #10101e;
      --bg-panel: rgba(18, 18, 36, 0.75);
      --bg-glass: rgba(30, 30, 60, 0.6);
      --border-glass: rgba(130, 130, 240, 0.12);
      --text-primary: #eeeef8;
      --text-secondary: #b0b0d0;
      --text-muted: #6a6a8a;
      --accent: #7c6cf0;
      --accent-glow: #5d4ad6;
      --accent-cyan: #3dd9eb;
      --code-bg: #0e0e1a;
      --code-border: #2a2a50;
      --shadow: 0 20px 40px -12px rgba(0,0,0,0.8);
      --radius: 16px;
      --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 8px; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform var(--transition);
      backdrop-filter: blur(4px);
      z-index: 100;
    }
    .sidebar-header {
      padding: 20px 18px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10,10,22,0.7);
      backdrop-filter: blur(8px);
    }
    .sidebar-header .logo {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-header .badge {
      background: var(--accent-glow);
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 40px;
      color: #fff;
      letter-spacing: 0.3px;
      font-weight: 600;
      -webkit-text-fill-color: white;
    }

    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-glass);
    }
    .sidebar-search input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 40px;
      border: 1px solid var(--border-glass);
      background: var(--bg-panel);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .sidebar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,108,240,0.25); }
    .sidebar-search input::placeholder { color: var(--text-muted); }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px 30px;
    }
    .sidebar-nav .category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 16px 12px 6px;
      font-weight: 600;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin-top: 6px;
    }
    .sidebar-nav .category:first-of-type { border-top: none; margin-top: 0; }

    .sidebar-nav .nav-item {
      display: block;
      padding: 5px 14px 5px 18px;
      border-radius: 10px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      border-left: 2px solid transparent;
      margin: 1px 0;
    }
    .sidebar-nav .nav-item:hover, .sidebar-nav .nav-item.active {
      background: var(--bg-glass);
      color: #fff;
      border-left-color: var(--accent);
      box-shadow: 0 0 20px rgba(124,108,240,0.15);
    }
    .sidebar-nav .nav-item .sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
      padding-left: 6px;
    }
    .sidebar-nav .group-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 6px 14px;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-radius: 10px;
      transition: var(--transition);
      margin-top: 2px;
      letter-spacing: 0.2px;
    }
    .sidebar-nav .group-toggle:hover { background: var(--bg-glass); color: #fff; box-shadow: 0 0 16px rgba(124,108,240,0.08); }
    .sidebar-nav .group-toggle .arrow { transition: transform 0.2s; display: inline-block; font-size: 11px; margin-right: 4px; }
    .sidebar-nav .group-toggle.open .arrow { transform: rotate(90deg); }
    .sidebar-nav .group-children { overflow: hidden; padding-left: 10px; border-left: 1px solid var(--border-glass); margin-left: 8px; display: none; }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 40px 80px;
      background: radial-gradient(ellipse at 20% 30%, rgba(60, 40, 160, 0.08) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 70%, rgba(0, 180, 220, 0.05) 0%, transparent 50%);
    }
    .main .breadcrumb {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .main .breadcrumb span { color: var(--text-secondary); }

    .main h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #fff 60%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .main .subhead {
      color: var(--text-secondary);
      font-size: 16px;
      margin-bottom: 28px;
      border-left: 3px solid var(--accent);
      padding-left: 16px;
    }

    .doc-section {
      background: var(--bg-panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.3s, border-color 0.3s;
    }
    .doc-section:hover {
      box-shadow: 0 24px 48px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(124,108,240,0.15);
      border-color: rgba(124,108,240,0.25);
    }

    .doc-section h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .doc-section h2 .type-tag {
      font-size: 12px;
      background: var(--accent-glow);
      padding: 2px 14px;
      border-radius: 40px;
      font-weight: 500;
      letter-spacing: 0.3px;
      -webkit-text-fill-color: white;
      box-shadow: 0 0 12px rgba(93,74,214,0.3);
    }
    .doc-section .signature {
      font-family: 'JetBrains Mono', monospace;
      background: var(--code-bg);
      padding: 12px 18px;
      border-radius: 12px;
      border: 1px solid var(--code-border);
      color: var(--accent-cyan);
      font-size: 14px;
      margin: 14px 0 10px;
      overflow-x: auto;
    }
    .doc-section .desc {
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 8px 0 12px;
    }
    .doc-section .params, .doc-section .returns {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 4px 12px;
      background: rgba(0,0,0,0.25);
      padding: 12px 16px;
      border-radius: 12px;
      margin: 8px 0 12px;
      font-size: 14px;
    }
    .doc-section .params .pname, .doc-section .returns .rname {
      color: var(--accent-cyan);
      font-weight: 500;
    }
    .doc-section .params .ptype, .doc-section .returns .rtype {
      color: var(--text-muted);
      font-size: 12px;
    }

    .code-block {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 12px;
      margin: 16px 0 8px;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .code-block:hover { border-color: rgba(124,108,240,0.3); }
    .code-block pre {
      padding: 18px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow-x: auto;
      color: #e0e0f0;
    }
    .code-block .copy-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: var(--bg-glass);
      border: none;
      color: var(--text-secondary);
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      backdrop-filter: blur(4px);
    }
    .code-block .copy-btn:hover { background: var(--accent); color: #fff; box-shadow: 0 0 20px rgba(124,108,240,0.3); }

    .note {
      background: rgba(60, 60, 160, 0.15);
      border-left: 4px solid var(--accent);
      padding: 12px 18px;
      border-radius: 8px;
      margin: 12px 0;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .note strong { color: var(--text-primary); }
    .note a { color: var(--accent-cyan); text-decoration: none; border-bottom: 1px dotted var(--accent-cyan); cursor: pointer; }
    .note a:hover { color: #fff; border-bottom-color: #fff; }

    .grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) { .grid-2col { grid-template-columns: 1fr; } }

    .hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 26px;
      padding: 8px 14px;
      cursor: pointer;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      background: var(--bg-panel);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-glass);
    }
    @media (max-width: 760px) {
      .sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 280px; transform: translateX(-110%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .hamburger { display: block; }
      .main { padding: 20px 16px 60px; }
    }

    .glow-text { color: var(--accent-cyan); }
    .tag { background: var(--bg-glass); padding: 2px 10px; border-radius: 40px; font-size: 12px; color: var(--text-secondary); }

    .fade-in { animation: fadeUp 0.5s ease forwards; opacity: 0; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .event-params { background: rgba(0,0,0,0.25); padding: 12px 16px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; margin: 6px 0 12px; }
    .related-link { display: inline-block; margin-right: 8px; padding: 2px 12px; background: rgba(124,108,240,0.15); border-radius: 40px; font-size: 13px; color: var(--accent-cyan); }
    .related-link:hover { background: rgba(124,108,240,0.3); color: #fff; }
  </style>
</head>
<body>
<button class="hamburger" id="hamburger" aria-label="Toggle navigation">☰</button>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="logo">⚡ DripHook</span>
    <span class="badge">Lua API</span>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search" placeholder="Search API…" autocomplete="off">
  </div>
  <nav class="sidebar-nav" id="navContainer"></nav>
</aside>

<main class="main" id="mainContent">
  <div class="breadcrumb">Lua API <span>/ Reference</span></div>
  <h1>Scripting API</h1>
  <div class="subhead">Complete reference for DripHook Lua environment · 100+ bindings</div>
  <div id="docContent"></div>
</main>

<script>
// --------------------------------------------------------------
// DATA: extracted from Bridge.cpp / StdLib.h
// --------------------------------------------------------------
const API = {
  global: {
    functions: [
      { name: 'print', sig: 'print(...)', desc: 'Logs to console with default color.', params: [{name:'...', type:'any'}] },
      { name: 'error', sig: 'error(msg)', desc: 'Prints an error message in red.', params: [{name:'msg', type:'string'}] },
      { name: 'print_raw', sig: 'print_raw(msg, [color])', desc: 'Prints raw message with optional color.', params: [{name:'msg',type:'string'},{name:'color',type:'color',opt:true}] },
      { name: 'chat_print', sig: 'chat_print(msg)', desc: 'Sends a message to in-game chat (prepends a space).', params: [{name:'msg',type:'string'}] },
      { name: 'safe_call', sig: 'safe_call(func)', desc: 'Calls a protected function and prints any errors.', params: [{name:'func',type:'function'}] },
      { name: 'to_ticks', sig: 'to_ticks(time)', desc: 'Converts seconds to ticks.', params: [{name:'time',type:'float'}] },
      { name: 'to_time', sig: 'to_time(ticks)', desc: 'Converts ticks to seconds.', params: [{name:'ticks',type:'int'}] }
    ]
  },
  namespaces: {
    client: {
      desc: 'Client-side hooks and utilities.',
      functions: [
        { name: 'add_callback', sig: 'client.add_callback(event, func)', desc: 'Registers a hook for the given event. See <a href="#events-section" class="event-link">Events</a> section for available events.', params: [{name:'event',type:'string'},{name:'func',type:'function'}] },
        { name: 'unload_script', sig: 'client.unload_script()', desc: 'Unloads the current script.', params: [] },
        { name: 'reload_script', sig: 'client.reload_script()', desc: 'Reloads the current script.', params: [] }
      ]
    },
    entity: {
      desc: 'Entity management and manipulation.',
      functions: [
        { name: 'get', sig: 'entity.get(index, [is_userid])', desc: 'Gets an entity by index or userid.', params: [{name:'index',type:'int'},{name:'is_userid',type:'bool',opt:true}] },
        { name: 'get_local_player', sig: 'entity.get_local_player()', desc: 'Returns the local player.', params: [] },
        { name: 'get_player_resource', sig: 'entity.get_player_resource()', desc: 'Returns the player resource entity.', params: [] },
        { name: 'from_handle', sig: 'entity.from_handle(handle)', desc: 'Gets entity from a handle.', params: [{name:'handle',type:'uint'}] }
      ]
    },
    ui: {
      desc: 'User interface controls and elements.',
      functions: [
        { name: 'tab', sig: 'ui.tab(name, [icon])', desc: 'Creates a new tab in the menu.', params: [{name:'name',type:'string'},{name:'icon',type:'image_t',opt:true}] },
        { name: 'groupbox', sig: 'ui.groupbox(tab, name)', desc: 'Creates a groupbox inside a tab.', params: [{name:'tab',type:'string'},{name:'name',type:'string'}] },
        { name: 'find', sig: 'ui.find(tab, group, [widget], [wtype])', desc: 'Finds a UI element.', params: [{name:'tab',type:'string'},{name:'group',type:'string'},{name:'widget',type:'string',opt:true},{name:'wtype',type:'WidgetType',opt:true}] },
        { name: 'is_open', sig: 'ui.is_open()', desc: 'Returns true if the menu is open.', params: [] },
        { name: 'get_binds', sig: 'ui.get_binds()', desc: 'Returns a table of active keybinds.', params: [] }
      ]
    },
    render: {
      desc: 'Rendering and drawing functions.',
      functions: [
        { name: 'screen_size', sig: 'render.screen_size()', desc: 'Returns screen dimensions as vector.', params: [] },
        { name: 'camera_angles', sig: 'render.camera_angles([angle])', desc: 'Gets or sets camera angles.', params: [{name:'angle',type:'qangle',opt:true}] },
        { name: 'camera_position', sig: 'render.camera_position()', desc: 'Returns camera world position.', params: [] },
        { name: 'get_weapon_icon', sig: 'render.get_weapon_icon(weap_id)', desc: 'Returns weapon icon image.', params: [{name:'weap_id',type:'int'}] },
        { name: 'add_font', sig: 'render.add_font(memory)', desc: 'Adds a font from memory (TTF/OTF data).', params: [{name:'memory',type:'string'}] },
        { name: 'load_font', sig: 'render.load_font(name, size, flags)', desc: 'Loads a font by name and size. flags: "b" bold, "a" antialias', params: [{name:'name',type:'string'},{name:'size',type:'int'},{name:'flags',type:'string'}] },
        { name: 'load_image', sig: 'render.load_image(memory, size)', desc: 'Loads image from memory (PNG/JPG).', params: [{name:'memory',type:'string'},{name:'size',type:'vector'}] },
        { name: 'line', sig: 'render.line(start, end, color)', desc: 'Draws a 2D line.', params: [{name:'start',type:'vector'},{name:'end',type:'vector'},{name:'color',type:'color'}] },
        { name: 'poly', sig: 'render.poly(color, ...vertices)', desc: 'Draws a filled polygon.', params: [{name:'color',type:'color'},{name:'...',type:'vector'}] },
        { name: 'poly_line', sig: 'render.poly_line(color, ...vertices)', desc: 'Draws a polyline.', params: [{name:'color',type:'color'},{name:'...',type:'vector'}] },
        { name: 'rect', sig: 'render.rect(start, end, color, [rounding])', desc: 'Draws a filled rectangle.', params: [{name:'start',type:'vector'},{name:'end',type:'vector'},{name:'color',type:'color'},{name:'rounding',type:'int',opt:true}] },
        { name: 'rect_outline', sig: 'render.rect_outline(start, end, color, [rounding])', desc: 'Draws a rectangle outline.', params: [{name:'start',type:'vector'},{name:'end',type:'vector'},{name:'color',type:'color'},{name:'rounding',type:'int',opt:true}] },
        { name: 'gradient', sig: 'render.gradient(start, end, tl, tr, bl, br)', desc: 'Draws a gradient-filled rectangle.', params: [{name:'start',type:'vector'},{name:'end',type:'vector'},{name:'tl',type:'color'},{name:'tr',type:'color'},{name:'bl',type:'color'},{name:'br',type:'color'}] },
        { name: 'circle', sig: 'render.circle(center, color, radius, [start_deg], [pct])', desc: 'Draws a filled circle.', params: [{name:'center',type:'vector'},{name:'color',type:'color'},{name:'radius',type:'float'},{name:'start_deg',type:'float',opt:true},{name:'pct',type:'float',opt:true}] },
        { name: 'circle_outline', sig: 'render.circle_outline(center, color, radius, [start_deg], [pct], [thickness])', desc: 'Draws a circle outline.', params: [{name:'center',type:'vector'},{name:'color',type:'color'},{name:'radius',type:'float'},{name:'start_deg',type:'float',opt:true},{name:'pct',type:'float',opt:true},{name:'thickness',type:'int',opt:true}] },
        { name: 'circle_gradient', sig: 'render.circle_gradient(center, outer, inner, radius)', desc: 'Draws a radial gradient circle.', params: [{name:'center',type:'vector'},{name:'outer',type:'color'},{name:'inner',type:'color'},{name:'radius',type:'float'}] },
        { name: 'circle_3d', sig: 'render.circle_3d(center, color, radius)', desc: 'Draws a 3D circle (filled).', params: [{name:'center',type:'vector'},{name:'color',type:'color'},{name:'radius',type:'float'}] },
        { name: 'circle_3d_outline', sig: 'render.circle_3d_outline(center, color, radius)', desc: 'Draws a 3D circle outline.', params: [{name:'center',type:'vector'},{name:'color',type:'color'},{name:'radius',type:'float'}] },
        { name: 'texture', sig: 'render.texture(image, pos, [color])', desc: 'Draws an image.', params: [{name:'image',type:'image_t'},{name:'pos',type:'vector'},{name:'color',type:'color',opt:true}] },
        { name: 'text', sig: 'render.text(font, pos, color, flags, text)', desc: 'Draws text. flags: c=center, o=outline, d=dropshadow', params: [{name:'font',type:'int|D3DXFont*'},{name:'pos',type:'vector'},{name:'color',type:'color'},{name:'flags',type:'string'},{name:'text',type:'string'}] },
        { name: 'measure_text', sig: 'render.measure_text(font, text)', desc: 'Returns text size as vector.', params: [{name:'font',type:'int|D3DXFont*'},{name:'text',type:'string'}] },
        { name: 'vertex', sig: 'render.vertex(draw_type, ...vertices)', desc: 'Draws custom vertices.', params: [{name:'draw_type',type:'int'},{name:'...',type:'vertex'}] },
        { name: 'push_clip_rect', sig: 'render.push_clip_rect(start, end)', desc: 'Pushes a clip rectangle.', params: [{name:'start',type:'vector'},{name:'end',type:'vector'}] },
        { name: 'pop_clip_rect', sig: 'render.pop_clip_rect()', desc: 'Pops the last clip rectangle.', params: [] },
        { name: 'world_to_screen', sig: 'render.world_to_screen(world_pos)', desc: 'Converts 3D world position to 2D screen.', params: [{name:'world_pos',type:'vector'}] }
      ]
    },
    common: {
      desc: 'General utility functions.',
      functions: [
        { name: 'get_map_name', sig: 'common.get_map_name()', desc: 'Returns full map name.', params: [] },
        { name: 'get_map_shortname', sig: 'common.get_map_shortname()', desc: 'Returns short map name.', params: [] },
        { name: 'get_local_time', sig: 'common.get_local_time()', desc: 'Returns system time as systime_t.', params: [] },
        { name: 'get_unix_time', sig: 'common.get_unix_time()', desc: 'Returns Unix timestamp.', params: [] },
        { name: 'is_recording_voice', sig: 'common.is_recording_voice()', desc: 'Returns true if voice is being recorded.', params: [] }
      ]
    },
    files: {
      desc: 'File system operations.',
      functions: [
        { name: 'read', sig: 'files.read(path)', desc: 'Reads a file and returns content.', params: [{name:'path',type:'string'}] },
        { name: 'write', sig: 'files.write(path, data)', desc: 'Writes data to a file (overwrites).', params: [{name:'path',type:'string'},{name:'data',type:'string'}] },
        { name: 'create_folder', sig: 'files.create_folder(path)', desc: 'Creates a directory (recursive).', params: [{name:'path',type:'string'}] },
        { name: 'exists', sig: 'files.exists(path)', desc: 'Returns true if file or directory exists.', params: [{name:'path',type:'string'}] },
        { name: 'delete_file', sig: 'files.delete_file(path)', desc: 'Deletes a file.', params: [{name:'path',type:'string'}] },
        { name: 'list_dir', sig: 'files.list_dir(path)', desc: 'Returns a table of filenames in a directory.', params: [{name:'path',type:'string'}] },
        { name: 'is_directory', sig: 'files.is_directory(path)', desc: 'Returns true if path is a directory.', params: [{name:'path',type:'string'}] },
        { name: 'file_size', sig: 'files.file_size(path)', desc: 'Returns file size in bytes.', params: [{name:'path',type:'string'}] }
      ]
    },
    json: {
      desc: 'JSON parsing and serialization.',
      functions: [
        { name: 'stringify', sig: 'json.stringify(table)', desc: 'Converts a Lua table to JSON string.', params: [{name:'table',type:'table'}] },
        { name: 'parse', sig: 'json.parse(data)', desc: 'Parses a JSON string into a Lua table.', params: [{name:'data',type:'string'}] }

// RENDER ENGINE
// --------------------------------------------------------------
const navContainer = document.getElementById('navContainer');
const docContent = document.getElementById('docContent');
const searchInput = document.getElementById('search');

function buildNav() {
  let html = `<div class="category">🌐 Global</div>`;
  API.global.functions.forEach(f => {
    html += `<a class="nav-item" data-target="global-${f.name}">${f.name}</a>`;
  });

  html += `<div class="category">📦 Namespaces</div>`;
  Object.keys(API.namespaces).forEach(ns => {
    html += `<div class="group-toggle" data-group="ns-${ns}"><span class="arrow">▶</span> ${ns}</div><div class="group-children" id="ns-${ns}">`;
    API.namespaces[ns].functions.forEach(f => {
      html += `<a class="nav-item" data-target="ns-${ns}-${f.name}">${f.name}</a>`;
    });
    html += `</div>`;
  });

  html += `<div class="category">🧩 User Types</div>`;
  Object.keys(API.types).forEach(t => {
    html += `<div class="group-toggle" data-group="type-${t}"><span class="arrow">▶</span> ${t}</div><div class="group-children" id="type-${t}">`;
    const type = API.types[t];
    if (type.methods) type.methods.forEach(m => {
      html += `<a class="nav-item" data-target="type-${t}-${m.name}">${m.name}</a>`;
    });
    if (type.props) type.props.forEach(p => {
      html += `<a class="nav-item" data-target="type-${t}-prop-${p}">.${p}</a>`;
    });
    html += `</div>`;
  });

  html += `<div class="category">📚 Standard Libraries</div>`;
  Object.keys(API.stdlibs).forEach(slib => {
    html += `<div class="group-toggle" data-group="stdlib-${slib}"><span class="arrow">▶</span> ${slib}</div><div class="group-children" id="stdlib-${slib}">`;
    const lib = API.stdlibs[slib];
    (lib.functions || []).forEach(f => {
      const name = typeof f === 'string' ? f : f.name;
      html += `<a class="nav-item" data-target="stdlib-${slib}-${name}">${name}</a>`;
    });
    if (lib.constants) lib.constants.forEach(c => {
      html += `<a class="nav-item" data-target="stdlib-${slib}-const-${c}">${c}</a>`;
    });
    html += `</div>`;
  });

  html += `<div class="category">⚡ Events</div>`;
  API.events.forEach(e => {
    html += `<a class="nav-item" data-target="event-${e.name}">${e.name}</a>`;
  });

  navContainer.innerHTML = html;

  document.querySelectorAll('.group-toggle').forEach(el => {
    el.addEventListener('click', function(e) {
      const target = document.getElementById(this.dataset.group);
      if (target) {
        const isOpen = target.style.display !== 'none';
        target.style.display = isOpen ? 'none' : 'block';
        this.classList.toggle('open');
      }
    });
    const target = document.getElementById(el.dataset.group);
    if (target) { target.style.display = 'none'; el.classList.remove('open'); }
  });

  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', function() {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      this.classList.add('active');
      const target = this.dataset.target;
      renderDoc(target);
      if (window.innerWidth <= 760) document.getElementById('sidebar').classList.remove('open');
    });
  });
}

function renderDoc(targetId) {
  let html = '';
  const parts = targetId.split('-');

  if (parts[0] === 'global') {
    const name = parts.slice(1).join('-');
    const fn = API.global.functions.find(f => f.name === name);
    if (fn) html = renderFunction(fn, 'Global', 'global');
  }

  if (parts[0] === 'ns') {
    const ns = parts[1];
    const name = parts.slice(2).join('-');
    const nsData = API.namespaces[ns];
    if (nsData) {
      const fn = nsData.functions.find(f => f.name === name);
      if (fn) html = renderFunction(fn, ns, 'ns');
    }
  }

  if (parts[0] === 'type') {
    const typeName = parts[1];
    const typeData = API.types[typeName];
    if (typeData) {
      if (parts[2] === 'prop') {
        const prop = parts[3];
        html = renderProperty(typeName, prop, typeData);
      } else {
        const methodName = parts.slice(2).join('-');
        const method = typeData.methods?.find(m => m.name === methodName);
        if (method) html = renderMethod(typeName, method, typeData);
      }
    }
  }

  if (parts[0] === 'stdlib') {
    const libName = parts[1];
    const lib = API.stdlibs[libName];
    if (lib) {
      if (parts[2] === 'const') {
        const constName = parts[3];
        html = renderStdConst(libName, constName, lib);
      } else {
        const fnName = parts.slice(2).join('-');
        const fn = lib.functions?.find(f => typeof f === 'string' ? f === fnName : f.name === fnName);
        if (fn) html = renderStdFunction(libName, fn, lib);
      }
    }
  }

  if (parts[0] === 'event') {
    const eventName = parts.slice(1).join('-');
    const ev = API.events.find(e => e.name === eventName);
    if (ev) html = renderEvent(ev);
  }

  if (!html) html = `<div class="doc-section"><p>Select an item from the sidebar.</p></div>`;
  docContent.innerHTML = html;
  document.querySelectorAll('.code-block pre').forEach(block => {
    block.innerHTML = block.textContent;
  });

  // Event link handlers
  document.querySelectorAll('.event-link').forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const targetId = this.getAttribute('href').substring(1);
      const targetEl = document.getElementById(targetId);
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: 'smooth' });
        // Also highlight the corresponding nav item
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navItem = document.querySelector(`[data-target="event-${targetId.replace('events-section', '') || 'render'}"]`);
        if (navItem) navItem.classList.add('active');
      }
    });
  });
}

function renderFunction(fn, namespace, type) {
  const paramsHtml = fn.params ? fn.params.map(p => 
    `<div><span class="pname">${p.name}</span> <span class="ptype">${p.type}${p.opt ? ' (optional)' : ''}</span></div>`
  ).join('') : '';

  let exampleHtml = '';
  const complex = ['trace_line', 'trace_hull', 'trace_bullet', 'get', 'post', 'create', 'draw_chams', 'set_move', 'add_callback', 'get_local_player', 'from_handle'];
  if (complex.some(c => fn.name.includes(c))) {
    exampleHtml = `<div class="code-block"><button class="copy-btn">Copy</button><pre>${generateExample(fn, namespace)}</pre></div>`;
  }

  let related = '';
  if (fn.name === 'add_callback') {
    related = `<div class="note"><strong>Related:</strong> See <a href="#events-section" class="event-link">Events</a> section for all available events.</div>`;
  }

  return `
    <div class="doc-section fade-in">
      <h2>${fn.name} <span class="type-tag">function</span></h2>
      <div class="signature">${fn.sig}</div>
      <div class="desc">${fn.desc}</div>
      ${fn.params ? `<div class="params">${paramsHtml}</div>` : ''}
      ${exampleHtml}
      ${related}
      <div class="note"><strong>Namespace:</strong> ${namespace}</div>
    </div>
  `;
}

function renderMethod(typeName, method, typeData) {
  const paramsHtml = method.params ? method.params.map(p => 
    `<div><span class="pname">${p.name}</span> <span class="ptype">${p.type}${p.opt ? ' (optional)' : ''}</span></div>`
  ).join('') : '';

  let exampleHtml = '';
  const complex = ['set_move', 'lerp', 'trace', 'get', 'post', 'draw_chams'];
  if (complex.some(c => method.name.includes(c))) {
    exampleHtml = `<div class="code-block"><button class="copy-btn">Copy</button><pre>${generateExample(method, typeName)}</pre></div>`;
  }

  return `
    <div class="doc-section fade-in">
      <h2>${typeName}:${method.name} <span class="type-tag">method</span></h2>
      <div class="signature">${method.sig}</div>
      <div class="desc">${method.desc}</div>
      ${method.params ? `<div class="params">${paramsHtml}</div>` : ''}
      ${exampleHtml}
      <div class="note"><strong>Type:</strong> ${typeName}</div>
    </div>
  `;
}

function renderProperty(typeName, prop, typeData) {
  return `
    <div class="doc-section fade-in">
      <h2>${typeName}.${prop} <span class="type-tag">property</span></h2>
      <div class="desc">Property of ${typeName}.</div>
      <div class="note"><strong>Type:</strong> ${typeName}</div>
    </div>
  `;
}

function renderStdFunction(libName, fn, lib) {
  const name = typeof fn === 'string' ? fn : fn.name;
  const sig = typeof fn === 'string' ? `${libName}.${fn}()` : fn.sig || `${libName}.${fn.name}()`;
  const desc = typeof fn === 'string' ? '' : fn.desc || '';
  const example = fn.example || `-- Example:\nlocal result = ${libName}.${name}()`;
  
  return `
    <div class="doc-section fade-in">
      <h2>${libName}.${name} <span class="type-tag">stdlib</span></h2>
      <div class="signature">${sig}</div>
      <div class="desc">${desc || 'Standard library function.'}</div>
      <div class="code-block"><button class="copy-btn">Copy</button><pre>${example}</pre></div>
      <div class="note"><strong>Library:</strong> ${libName}</div>
    </div>
  `;
}

function renderStdConst(libName, constName, lib) {
  return `
    <div class="doc-section fade-in">
      <h2>${libName}.${constName} <span class="type-tag">constant</span></h2>
      <div class="desc">Constant from ${libName} library.</div>
      <div class="code-block"><button class="copy-btn">Copy</button><pre>-- Use:\nlocal val = ${libName}.${constName}</pre></div>
    </div>
  `;
}

function renderEvent(ev) {
  const paramsHtml = ev.params ? ev.params.map(p => 
    `<div><span class="pname">${p.name}</span> <span class="ptype">${p.type}</span></div>`
  ).join('') : '';

  return `
    <div class="doc-section fade-in" id="events-section">
      <h2>${ev.name} <span class="type-tag">event</span></h2>
      <div class="desc">${ev.desc}</div>
      ${ev.params ? `<div class="event-params"><strong>Parameters:</strong> ${paramsHtml}</div>` : ''}
      <div class="code-block"><button class="copy-btn">Copy</button><pre>${ev.example || `client.add_callback("${ev.name}", function(${ev.params ? ev.params.map(p=>p.name).join(', ') : ''})\n    -- your code here\nend)`}</pre></div>
      <div class="note"><strong>Event</strong> — use with client.add_callback</div>
    </div>
  `;
}

function generateExample(fn, context) {
  const name = fn.name;
  if (name === 'get_local_player') {
    return `local local_player = entity.get_local_player()\nif local_player then\n    print("Local player health: " .. local_player:get_health())\nend`;
  } else if (name === 'trace_line') {
    return `local start = entity.get_local_player():get_eye_position()\nlocal end_pos = start + vector(0, 0, 100)\nlocal trace = utils.trace_line(start, end_pos, 0xFFFFFFFF, function(ent) return ent:is_player() end)\nprint("Trace fraction: " .. trace.fraction)`;
  } else if (name === 'trace_bullet') {
    return `local local_player = entity.get_local_player()\nlocal target = entity.get(2)\nif target and target:is_alive() then\n    local data = utils.trace_bullet(local_player, local_player:get_eye_position(), target:get_eye_position())\n    print("Damage: " .. data.damage)\nend`;
  } else if (name === 'set_move') {
    return `-- Inside createmove callback\nclient.add_callback("createmove", function(cmd)\n    cmd:set_move(90, 250) -- move right at 250 speed\nend)`;
  } else if (name === 'add_callback') {
    return `client.add_callback("render", function()\n    local player = entity.get_local_player()\n    if player and player:is_alive() then\n        render.text(1, vector(10, 10), color(255,255,255), "", "Hello from Lua!")\n    end\nend)`;
  } else if (name === 'draw_chams') {
    return `local mat = materials.create("my_chams", "VertexLitGeneric", { color = {1,0,0}, envmap = "models/effects/cube_white" })\nmaterials.draw_chams(mat)`;
  } else if (name === 'get' && context === 'entity') {
    return `local player = entity.get(1) -- get first entity\nif player and player:is_player() then\n    print("Entity is a player: " .. player:get_name())\nend`;
  } else if (name === 'from_handle') {
    return `local handle = 0x12345678\nlocal ent = entity.from_handle(handle)\nif ent then\n    print("Entity found from handle")\nend`;
  } else if (name === 'post' || name === 'get') {
    return `network.get("https://api.example.com/data", { ["Authorization"] = "Bearer token" }, function(response)\n    print("Got response: " .. response)\nend)`;
  } else if (name === 'create') {
    return `local mat = materials.create("my_material", "VertexLitGeneric", { color = {1,0,0}, envmap = "models/effects/cube_white" })\nprint("Created material: " .. mat:get_name())`;
  } else if (name === 'lerp') {
    return `local start = vector(0, 0, 0)\nlocal target = vector(10, 10, 10)\nlocal result = vector.lerp(start, target, 0.5) -- returns (5,5,5)`;
  } else {
    const args = fn.params ? fn.params.map(p => p.name).join(', ') : '';
    return `local result = ${context}.${name}(${args})`;
  }
}

// Search
searchInput.addEventListener('input', function() {
  const query = this.value.toLowerCase().trim();
  document.querySelectorAll('.nav-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(query) ? 'block' : 'none';
  });
  document.querySelectorAll('.group-children').forEach(g => {
    const children = g.querySelectorAll('.nav-item');
    let visible = false;
    children.forEach(c => { if (c.style.display !== 'none') visible = true; });
    g.style.display = visible ? 'block' : 'none';
    const toggle = document.querySelector(`[data-group="${g.id}"]`);
    if (toggle) toggle.classList.toggle('open', visible);
  });
});

// Copy buttons
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('copy-btn')) {
    const pre = e.target.parentElement.querySelector('pre');
    if (pre) {
      navigator.clipboard?.writeText(pre.textContent);
      e.target.textContent = 'Copied!';
      setTimeout(() => e.target.textContent = 'Copy', 1200);
    }
  }
});

// Hamburger
document.getElementById('hamburger').addEventListener('click', function() {
  document.getElementById('sidebar').classList.toggle('open');
});

// Init

  });
});
